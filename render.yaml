services:
  - type: web
    name: kiko-backend
    env: node
    plan: free
    rootDir: website/backend
    buildCommand: npm install --legacy-peer-deps && npx prisma generate
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_SECRET
        generateValue: true
